name: Relatório de KPIs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest

      - name: Testes de qualidade e de KPIs
        run: pytest -q

      - name: Pipeline SQL + exportação para o Power BI + relatórios mensais
        run: |
          python src/build.py
          python src/report.py

      - name: Publicar artefatos atualizados
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add powerbi/dados reports docs
          if git diff --cached --quiet; then
            echo "Relatórios já atualizados."
          else
            git commit -m "relatórios: atualização automática"
            git push
          fi
